<section class="login">
  <div class="login__panel">
    <img
      class="login__logo"
      src="assets/brand/logo-dark.png"
      alt="NEXALAB"
    />
    <h1>Panel administrativo</h1>
    <p>Acceso privado para gestionar divisiones, catálogo y pedidos.</p>

    <form (ngSubmit)="submit()" #form="ngForm">
      <div class="nx-field">
        <label class="nx-label" for="email">Email</label>
        <input
          id="email"
          class="nx-input"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="username"
        />
      </div>

      <div class="nx-field">
        <label class="nx-label" for="password">Contraseña</label>
        <input
          id="password"
          class="nx-input"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="8"
          autocomplete="current-password"
        />
      </div>

      <button class="nx-btn nx-btn-primary login__submit" type="submit" [disabled]="loading() || form.invalid">
        {{ loading() ? 'Ingresando…' : 'Iniciar sesión' }}
      </button>
    </form>
  </div>
</section>
