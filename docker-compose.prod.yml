# Stack de producción para Portainer
# Repository: https://github.com/Advanced52/NEXALAB.git
# Compose path: docker-compose.prod.yml
# Reference: refs/heads/main

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nexalab-backend:latest
    container_name: nexalab-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      API_PREFIX: api/v1
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SYNC: ${DB_SYNC}
      DB_LOGGING: 'false'
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB}
    volumes:
      - nexalab_uploads:/app/uploads
    networks:
      - nexalab
      - postgres_default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nexalab-frontend:latest
    container_name: nexalab-frontend
    restart: unless-stopped
    ports:
      - '${NEXALAB_HTTP_PORT}:80'
    depends_on:
      - backend
    networks:
      - nexalab

volumes:
  nexalab_uploads:

networks:
  nexalab:
    name: nexalab
  postgres_default:
    external: true
    name: postgres_default
