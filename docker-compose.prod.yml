# Stack de producción para Portainer (usa Postgres que ya tienes)
# Compose path: docker-compose.prod.yml
#
# Importante: une este stack a la misma red Docker donde corre tu Postgres.
# En Portainer: Stack → Editor → al final, o en Advanced → Networks.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nexalab-backend:latest
    container_name: nexalab-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_PORT: 3000
      APP_URL: ${APP_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      API_PREFIX: api/v1
      DB_HOST: ${DB_HOST:?set DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-bd_nexalab}
      DB_SYNC: ${DB_SYNC:-true}
      DB_LOGGING: 'false'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nexalab.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador NEXALAB}
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
    volumes:
      - nexalab_uploads:/app/uploads
    networks:
      - nexalab
      - shared

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: nexalab-frontend:latest
    container_name: nexalab-frontend
    restart: unless-stopped
    ports:
      - '${NEXALAB_HTTP_PORT:-8088}:80'
    depends_on:
      - backend
    networks:
      - nexalab

volumes:
  nexalab_uploads:

networks:
  nexalab:
    name: nexalab
  # Red Docker donde ya corre tu Postgres (obligatoria).
  # Ejemplo: si el otro stack usa la red "proxy", pon DOCKER_SHARED_NETWORK=proxy
  shared:
    external: true
    name: ${DOCKER_SHARED_NETWORK:?set DOCKER_SHARED_NETWORK}
