# Auto-deploy: push a main → GitHub Actions → webhook Portainer
#
# Setup:
# 1. Portainer → Stacks → nexalab → Webhooks → copia URL
# 2. GitHub → Settings → Secrets and variables → Actions
#    → New secret: PORTAINER_WEBHOOK_URL = esa URL

name: Deploy NEXALAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  notify-portainer:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer webhook
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Falta el secret PORTAINER_WEBHOOK_URL"
            echo "GitHub → Settings → Secrets → Actions → New repository secret"
            echo "Name: PORTAINER_WEBHOOK_URL"
            echo "Value: la URL del webhook del stack nexalab en Portainer"
            exit 1
          fi

          echo "Avisando a Portainer..."
          HTTP_CODE=$(curl -sS -o /tmp/portainer_response.txt -w "%{http_code}" -X POST "$WEBHOOK_URL")
          echo "HTTP $HTTP_CODE"
          cat /tmp/portainer_response.txt || true
          echo

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Portainer respondió $HTTP_CODE"
            exit 1
          fi

          echo "OK — Portainer actualizará el stack (git pull + rebuild)."
